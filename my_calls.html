<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4A63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="موارد">
<meta name="application-name" content="موارد">
<meta name="msapplication-TileColor" content="#0B4A63">
<meta name="msapplication-TileImage" content="assets/icons/icon-144.png">

<title>سجل مكالماتي — شركة الموارد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mawared.css?v=20261004-brand">
</head>
<body>
<div id="bar"></div>
<main class="wrap medium">
  <div class="panel"><div class="panel-b"><div class="filters">
    <label class="field"><span>من</span><input class="input" type="date" id="from" dir="ltr" style="text-align:right"></label>
    <label class="field"><span>إلى</span><input class="input" type="date" id="to" dir="ltr" style="text-align:right"></label>
    <div class="chips" id="q" style="margin:0">
      <button class="chip" data-d="0" type="button">اليوم</button><button class="chip on" data-d="7" type="button">7 أيام</button><button class="chip" data-d="30" type="button">30 يوم</button>
    </div></div></div></div>
  <div class="kpis" id="kpis"></div>
  <div id="list"></div>
</main>
<script src="assets/app.js?v=20261004-brand"></script>
<script>
if (!M.guard()) throw new Error('auth');
const $ = id => document.getElementById(id), esc = M.esc;
const home = { collector: 'collector.html', data_entry: 'dataentry.html', admin: 'admin.html', super_admin: 'superadmin.html' }[M.user.role] || 'collector.html';
$('bar').innerHTML = M.appbar({ title: 'سجل مكالماتي', sub: M.user.full_name, actions: `<a class="btn sm" href="${home}">${M.icon('home')} <span>رجوع</span></a>` });

function setRange(d) {
  $('from').value = M.daysAgo(d === 0 ? 0 : d - 1); $('to').value = M.today();
  M.$$('#q .chip').forEach(c => c.classList.toggle('on', +c.dataset.d === d));
}
async function load() {
  $('list').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  const j = await M.get('get_calls', { from: $('from').value, to: $('to').value });
  if (!j.success) { $('list').innerHTML = `<div class="empty">${esc(j.message)}</div>`; return; }
  // أدمن/سوبر أدمن بيشوفوا مكالمات الفريق، هنا بنعرض مكالمات المستخدم نفسه بس
  const calls = j.calls.filter(c => +c.user_id === +M.user.id);
  const calling = calls.filter(c => !String(c.status || '').startsWith('زيارة'));
  $('kpis').innerHTML = `<div class="kpi"><small>مكالمات</small><b>${M.num(calling.length)}</b></div>
    <div class="kpi"><small>تواصل ناجح</small><b class="ok">${M.num(calling.filter(c => c.status === 'تم التواصل بنجاح').length)}</b></div>
    <div class="kpi"><small>تعهدات</small><b class="info">${M.num(calling.filter(c => c.status === 'تعهد بالسداد').length)}</b></div>
    <div class="kpi"><small>لم يرد</small><b class="bad">${M.num(calling.filter(c => c.status === 'لم يتم الرد').length)}</b></div>`;
  if (!calls.length) { $('list').innerHTML = `<div class="empty">${M.icon('phone')}مفيش مكالمات في الفترة دي</div>`; return; }
  $('list').innerHTML = `<div class="list">${calls.map(c => `<div class="item" style="cursor:default">
    <div class="grow"><div class="item-t">${esc(c.customer_name || '—')}</div>
      <div class="item-s">${M.ltr(c.phone)} · ${M.dt(c.called_at)}</div>
      ${c.dcr ? `<div class="item-s" style="color:var(--ink-2)">${esc(c.dcr)}</div>` : ''}</div>
    <div>${M.callTag(c.status)}</div></div>`).join('')}</div>`;
}
$('q').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { setRange(+b.dataset.d); load(); } });
['from', 'to'].forEach(id => $(id).addEventListener('change', () => { M.$$('#q .chip').forEach(c => c.classList.remove('on')); load(); }));
setRange(7); load();
</script>
</body>
</html>
