<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4A63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="موارد">
<meta name="application-name" content="موارد">
<meta name="msapplication-TileColor" content="#0B4A63">
<meta name="msapplication-TileImage" content="assets/icons/icon-144.png">

<title>إدخال البيانات والزيارات — شركة الموارد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mawared.css?v=20261004-brand">
</head>
<body class="has-tabbar">
<div id="bar"></div>

<main class="wrap medium">
  <div id="dailyTargetBox"></div>
  <div id="myTasksBox"></div>
  <div id="collectionCycleBox"></div>
  <nav class="tabbar" id="tabs" aria-label="أقسام الصفحة">
    <button data-tab="clients" type="button" id="tClients"></button>
    <button data-tab="visits" type="button" id="tVisits"></button>
  </nav>

  <!-- ============ العملاء ============ -->
  <section class="tabpane" id="pane-clients">
    <div class="row nowrap" style="margin-bottom:10px">
      <input class="input grow" id="q" type="search" placeholder="بحث: اسم / تليفون / رقم قومي" autocomplete="off">
      <button class="btn primary" type="button" id="bNew"></button>
    </div>
    <button class="btn block" id="btnNextCall" type="button" style="margin-bottom:10px"></button>
    <div class="chips" id="fChips">
      <button class="chip on" data-f="all" type="button">الكل</button>
      <button class="chip" data-f="not-visited" type="button">لم يُزَر</button>
      <button class="chip" data-f="has-visit" type="button">له زيارات</button>
      <button class="chip" data-f="high-delay" type="button">تأخير +30 يوم</button>
    </div>
    <div class="row nowrap" style="margin:0 2px 8px;justify-content:space-between">
      <div class="small muted" id="count"></div>
      <select class="select sm hide" id="fColl" aria-label="فلتر Coll"><option value="">كل الـ Coll</option></select>
    </div>
    <div id="cList"></div>
    <button class="btn block hide" type="button" id="bMore" style="margin-top:12px">عرض المزيد</button>
  </section>

  <!-- ============ الزيارات ============ -->
  <section class="tabpane" id="pane-visits">
    <div class="kpis day">
      <div class="kpi"><small>زيارات اليوم</small><b id="kTotal">0</b></div>
      <div class="kpi"><small>تمت</small><b class="ok" id="kDone">0</b></div>
      <div class="kpi"><small>متبقية</small><b class="warn" id="kPend">0</b></div>
    </div>
    <div class="chips" id="vChips">
      <button class="chip on" data-f="today" type="button">النهارده</button>
      <button class="chip" data-f="overdue" type="button" id="chOver">متأخرة</button>
      <button class="chip" data-f="done" type="button">تمت</button>
      <button class="chip" data-f="all" type="button">الكل</button>
    </div>
    <div id="vList"></div>
  </section>

</main>

<!-- بيانات عميل -->
<div class="overlay" id="cv" data-backdrop="1">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-h"><h3 id="cvTitle"></h3><button class="btn quiet icon-btn" type="button" onclick="M.close('cv')" aria-label="إغلاق" id="cvX"></button></div>
    <div class="sheet-b" id="cvBody"></div>
    <div class="sheet-f"><button class="btn" type="button" onclick="M.close('cv')">إغلاق</button><button class="btn primary" type="button" id="cvVisit"></button></div>
  </div>
</div>

<!-- تفاصيل زيارة -->
<div class="overlay" id="vd" data-backdrop="1">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-h"><h3 id="vdTitle"></h3><span id="vdTag"></span><button class="btn quiet icon-btn" type="button" onclick="M.close('vd')" aria-label="إغلاق" id="vdX"></button></div>
    <div class="sheet-b" id="vdBody"></div>
    <div class="sheet-f"><button class="btn danger" type="button" id="vdDel"></button><button class="btn primary" type="button" id="vdEdit"></button></div>
  </div>
</div>

<!-- نموذج الزيارة -->
<div class="overlay" id="vf">
  <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="vfTitle">
    <div class="sheet-h"><h3 id="vfTitle"></h3><button class="btn quiet icon-btn" type="button" onclick="M.close('vf')" aria-label="إغلاق" id="vfX"></button></div>
    <div class="sheet-b">
      <div class="section-t" style="margin-top:0">الزيارة</div>
      <div class="grid2">
        <label class="field"><span>المحصل *</span><select class="select" id="fCollector"></select></label>
        <label class="field"><span>تاريخ الزيارة</span><input class="input" type="date" id="fDate" dir="ltr" style="text-align:right"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>الحالة</span><select class="select" id="fStatus"></select></label>
        <label class="field hide" id="fAmtBox"><span>المبلغ المحصّل</span><input class="input" type="number" step="any" inputmode="decimal" id="fAmt" dir="ltr" style="text-align:right"></label>
      </div>
      <label class="field"><span>توجيهات للمحصل</span><textarea class="textarea" id="fDir" style="min-height:64px" placeholder="مثلاً: العميل بيكون موجود بعد العصر"></textarea></label>
      <div class="note hide" id="fCollNotes" style="margin-top:0;margin-bottom:12px"></div>

      <div class="section-t">بيانات العميل</div>
      <div class="grid2" id="fMain"></div>
      <details class="more"><summary>باقي البيانات (الضامن، النشاط، أرقام القرض)</summary><div class="grid2" id="fMore" style="margin-top:8px"></div></details>

      <div class="section-t">صور البطاقة</div>
      <div class="grid2">
        <label class="pick" id="pkF"><input type="file" accept="image/*"><span class="lbl">وجه البطاقة</span></label>
        <label class="pick" id="pkB"><input type="file" accept="image/*"><span class="lbl">ظهر البطاقة</span></label>
      </div>
      <p class="muted small" style="margin-top:8px">الصور بتتصغّر تلقائيًا قبل الرفع عشان تتحمّل بسرعة على النت.</p>
    </div>
    <div class="sheet-f"><button class="btn" type="button" onclick="M.close('vf')">إلغاء</button><button class="btn primary" type="button" id="vfSave">حفظ</button></div>
  </div>
</div>

<script src="assets/app.js?v=20261004-brand"></script>
<script>
if (!M.guard(['data_entry', 'admin', 'super_admin'])) throw new Error('auth');
const $ = id => document.getElementById(id), esc = M.esc;

const back = { admin: 'admin.html', super_admin: 'superadmin.html' }[M.user.role];
$('bar').innerHTML = M.appbar({
  title: M.user.full_name, sub: 'إدخال البيانات والزيارات',
  actions: back ? `<a class="btn sm" href="${back}">${M.icon('home')} <span>لوحتي</span></a>` : ''
});
$('tClients').innerHTML = M.icon('users') + '<span>العملاء</span>';
$('tVisits').innerHTML = M.icon('pin') + '<span>الزيارات</span>';
$('bNew').innerHTML = M.icon('plus') + ' عميل جديد';
$('bNew').classList.toggle('hide', M.user.role === 'data_entry');
['cvX', 'vdX', 'vfX'].forEach(id => $(id).innerHTML = M.icon('x'));
$('cvVisit').innerHTML = M.icon('plus') + ' إضافة زيارة';
$('vdDel').innerHTML = M.icon('trash') + ' حذف';
$('vdEdit').innerHTML = M.icon('edit') + ' تعديل الزيارة';

M.loadWorkPanel($('dailyTargetBox'), $('myTasksBox'));
document.addEventListener('visibilitychange', () => { if (!document.hidden) M.loadWorkPanel($('dailyTargetBox'), $('myTasksBox')); });


/* =====================================================================
   العملاء
   ===================================================================== */
const S = { q: '', coll: '', filter: 'all', offset: 0, total: 0, list: [], more: false, loading: false };
let seq = 0;
async function loadClients(reset = true) {
  if (reset) { S.offset = 0; S.list = []; $('cList').innerHTML = '<div class="empty"><span class="spin"></span></div>'; }
  const my = ++seq;
  const j = await M.get('get_team_clients', { q: S.q, coll: S.coll, filter: S.filter, offset: S.offset, limit: 50 });
  if (my !== seq) return; // وصل رد أحدث
  if (!j.success) { $('cList').innerHTML = `<div class="empty">${esc(j.message || 'تعذر التحميل')}</div>`; return; }
  S.list = S.list.concat(j.clients); S.total = j.total; S.more = j.has_more; S.offset = S.list.length;
  if (j.colls) fillColls(j.colls);
  renderClients();
}
function fillColls(colls) {
  const sel = $('fColl'), cur = S.coll;
  sel.innerHTML = '<option value="">كل الـ Coll</option>' + colls.map(c => `<option ${c === cur ? 'selected' : ''}>${esc(c)}</option>`).join('');
  sel.classList.toggle('hide', !colls.length);
}
function renderClients() {
  $('count').textContent = S.total ? `عرض ${M.num(S.list.length)} من ${M.num(S.total)} عميل` : '';
  $('bMore').classList.toggle('hide', !S.more);
  if (!S.list.length) {
    $('cList').innerHTML = `<div class="empty">${M.icon('users')}${S.q || S.filter !== 'all' || S.coll ? 'مفيش عملاء بالشكل ده' : 'لا يوجد عملاء مسندون لك حاليًا. تواصل مع المشرف لإسناد العملاء.'}</div>`;
    return;
  }
  $('cList').innerHTML = `<div class="list">${S.list.map((c, i) => {
    const d = +c.delay_days || 0, edge = d > 90 ? 's-bad' : d > 30 ? 's-warn' : 's-pending';
    const lastCall = c.last_call_at ? M.dt(c.last_call_at) : '—';
    const lastVisit = c.last_visit_at ? M.dt(c.last_visit_at) : '—';
    return `<div class="item ${edge}" data-i="${i}">
      <div class="grow">
        <div class="item-t">${esc(c.name)}</div>
        <div class="item-s">${c.phone ? '<span class="ltr num">' + esc(c.phone) + '</span>' : '<span class="tag warn">بدون رقم</span>'}${c.address ? ' · ' + esc(c.address) : ''}</div>
        <div class="item-s muted small" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:8px 14px">
          <span>${M.icon('phone')} آخر مكالمة: <b class="ltr" style="font-weight:600;color:var(--ink)">${esc(lastCall)}</b></span>
          <span>${M.icon('pin')} آخر زيارة: <b class="ltr" style="font-weight:600;color:var(--ink)">${esc(lastVisit)}</b></span>
        </div>
        <div class="item-x"><b class="num" style="color:var(--brass)">${M.money(M.debt(c).total)} ج.م</b>
          ${d ? `<span class="tag ${d > 90 ? 'bad' : 'warn'}">تأخير ${M.num(d)} يوم</span>` : ''}
          ${+c.visits_count ? `<span class="tag ok">${M.icon('check')} ${c.visits_count} زيارة</span>` : ''}
          ${+c.has_front ? `<span class="tag brand">${M.icon('card')} بطاقة</span>` : ''}</div>
      </div>
      <button class="btn primary sm" type="button" data-visit="${i}">${M.icon('plus')} زيارة</button></div>`;
  }).join('')}</div>`;
}
$('cList').addEventListener('click', e => {
  const b = e.target.closest('[data-visit]');
  if (b) { e.stopPropagation(); return openForm({ clientId: S.list[+b.dataset.visit].id }); }
  const it = e.target.closest('.item');
  if (it) openClient(S.list[+it.dataset.i].id);
});
$('bMore').onclick = e => M.busy(e.currentTarget, () => loadClients(false));
$('q').addEventListener('input', M.debounce(() => { S.q = $('q').value.trim(); loadClients(); }, 350));
$('fColl').onchange = () => { S.coll = $('fColl').value; loadClients(); };
$('fChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  M.$$('#fChips .chip').forEach(x => x.classList.toggle('on', x === b));
  S.filter = b.dataset.f; loadClients();
});
$('bNew').onclick = () => {
  if (['admin', 'super_admin'].includes(M.user.role)) openForm({});
};

// عرض بيانات عميل + تسجيل نتيجة مكالمة
const CALL_OUT = [['تم التواصل بنجاح', 'تم التواصل', 'ok'], ['لم يتم الرد', 'لم يرد', 'bad'], ['الخط مشغول', 'مشغول', 'warn'], ['تعهد بالسداد', 'تعهد بالسداد', 'info']];
const TEMPLATES = {
  inst: c => `السلام عليكم ${c.name}، بنفكّرك إن عليك قسط متأخر بقيمة ${M.money(c.installment)} جنيه. برجاء السداد في أقرب وقت لتجنب أي غرامات إضافية. شركة الموارد.`,
  ptp: c => `السلام عليكم ${c.name}، بنأكد على وعدك بالسداد${c.ptp_date ? ' يوم ' + c.ptp_date : ''}. نشكرك على التزامك. شركة الموارد.`,
  gen: c => `السلام عليكم ${c.name}، معاك شركة الموارد بخصوص مديونيتك. برجاء التواصل معنا لتسوية موقفك.`
};
let callStatus = '';
let cvId = 0;
async function openClient(id) {
  cvId = id; callStatus = '';
  $('cvTitle').textContent = 'جاري التحميل...'; $('cvBody').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  M.open('cv');
  const j = await M.get('get_client_by_id', { id });
  if (!j.success) { M.close('cv'); return M.err(j.message); }
  $('cvTitle').textContent = j.client.name;
  const c = j.client;
  const draft = localStorage.getItem('draft:' + c.id) || '';
  const today = c.already_contacted_today
    ? `<div class="alert warn">${M.icon('clock')}<div>اتكلمت مع العميل ده النهارده${c.last_contact_time ? ' الساعة ' + M.hm(c.last_contact_time) : ''}</div></div>` : '';

  let body = (c.phone ? `<div class="row nowrap">${M.callBtn(c.phone, { cls: 'primary grow', showNum: true, name: c.name })}</div>` : '')
    + `<div class="row nowrap" style="margin-top:8px">${c.phone ? `<select class="select grow" id="tpl"><option value="inst">رسالة: تذكير بالقسط</option><option value="ptp">رسالة: تأكيد تعهد</option><option value="gen">رسالة: عامة</option></select><a class="btn wa" id="aWa" target="_blank" rel="noopener" href="#">${M.icon('chat')} واتساب</a>` : ''}</div>`
    + today
    + M.customerBody(c) + M.notesBlock(c.dcr)
    + (c.ptp || c.ptp_date ? `<div class="note"><small>آخر تعهد</small>${esc(c.ptp || '')} ${c.ptp_date ? '· ' + esc(c.ptp_date) : ''}</div>` : '');

  // تسجيل نتيجة مكالمة
  body += `<div class="block" style="margin-top:12px"><div class="block-t">${M.icon('phone')} تسجيل نتيجة مكالمة</div>
    <div class="block-b">
      <div class="seg" id="cSeg">${CALL_OUT.map(o => `<button type="button" class="${o[2]}" data-s="${o[0]}">${o[1]}</button>`).join('')}</div>
      <div class="grid2 hide" id="ptpF" style="margin-top:12px">
        <label class="field" style="margin:0"><span>مبلغ التعهد</span><input class="input" id="ptp" inputmode="decimal" dir="ltr" style="text-align:right"></label>
        <label class="field" style="margin:0"><span>تاريخ السداد</span><input class="input" id="ptpDate" type="date" dir="ltr" style="text-align:right"></label>
      </div>
      <label class="field" style="margin-top:12px"><span>ملاحظة (DCR)</span><textarea class="textarea" id="dcr" placeholder="اللي حصل في المكالمة...">${esc(draft)}</textarea></label>
      <button class="btn primary block lg" type="button" id="bSaveCall">${M.icon('check')} حفظ نتيجة المكالمة</button>
    </div></div>`;

  // تذكير
  body += `<div class="block" style="margin-top:12px"><div class="block-t">${M.icon('bell')} تذكير على العميل</div>
    <div class="block-b">
      <div class="filters" style="margin:0">
        <label class="field grow"><span>متى؟</span><input class="input" type="datetime-local" id="rmAt" dir="ltr" style="text-align:right"></label>
        <label class="field grow"><span>ملاحظة</span><input class="input" id="rmNote" placeholder="مثال: كلّمه تاني في التعهد"></label>
      </div>
      <button class="btn sm primary" type="button" id="rmSave" style="margin-top:8px">${M.icon('bell')} ضبط تذكير</button>
    </div></div>`;

  // تايملاين
  body += `<div class="block" style="margin-top:12px"><div class="block-t">${M.icon('list')} السجل الكامل</div>
    <div class="block-b" id="cvTimeline"><span class="spin"></span> جاري التحميل...</div></div>`;

  $('cvBody').innerHTML = body;

  if (c.phone) { const setWa = () => { $('aWa').href = M.waUrl(c.phone, TEMPLATES[$('tpl').value](c)); }; $('tpl').onchange = setWa; setWa(); }

  M.$$('#cSeg button').forEach(b => b.onclick = () => {
    callStatus = b.dataset.s;
    M.$$('#cSeg button').forEach(x => x.classList.toggle('on', x === b));
    $('ptpF').classList.toggle('hide', callStatus !== 'تعهد بالسداد');
  });
  $('dcr').addEventListener('input', () => { try { localStorage.setItem('draft:' + c.id, $('dcr').value); } catch (e) {} });
  $('bSaveCall').onclick = e => M.busy(e.currentTarget, async () => {
    const dcr = $('dcr').value.trim();
    if (!callStatus && !dcr) return M.err('اختار حالة المكالمة أو اكتب ملاحظة');
    const jr = await M.post('update_customer', { client_id: c.id, status: callStatus, ptp: $('ptp') ? $('ptp').value.trim() : '', ptp_date: $('ptpDate') ? $('ptpDate').value : '', dcr });
    if (!jr.success) return M.err(jr.message);
    try { localStorage.removeItem('draft:' + c.id); } catch (e) {}
    M.toast('تم حفظ نتيجة المكالمة ✓');
    M.close('cv');
    loadClients(false);
  });

  // default remind = tomorrow 10:00
  try {
    const d = new Date(); d.setDate(d.getDate()+1); d.setHours(10,0,0,0);
    const pad = n => String(n).padStart(2,'0');
    $('rmAt').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch(e) {}

  $('rmSave').onclick = e => M.busy(e.currentTarget, async () => {
    const remind_at = ($('rmAt').value || '').replace('T', ' ');
    if (!remind_at) return M.err('اختار وقت التذكير');
    const j2 = await M.post('save_reminder', { client_id: id, remind_at, note: $('rmNote').value.trim() });
    if (!j2.success) return M.err(j2.message);
    M.toast('تم ضبط التذكير');
  });

  const tl = await M.get('client_timeline', { client_id: id });
  const box = $('cvTimeline');
  if (!tl.success) { box.innerHTML = `<div class="muted">${esc(tl.message||'تعذر التحميل')}</div>`; }
  else if (!(tl.events||[]).length) { box.innerHTML = `<div class="muted">مفيش مكالمات أو زيارات مسجّلة لسه</div>`; }
  else {
    box.innerHTML = `<div class="list" style="max-height:280px;overflow:auto">${tl.events.map(ev => {
      const tone = ev.type === 'call' ? 'brand' : 'ok';
      const ic = ev.type === 'call' ? 'phone' : 'pin';
      return `<div class="item" style="padding:10px 0;border-bottom:1px solid var(--line,#E7ECF0)">
        <div class="grow">
          <div class="item-t" style="font-size:13.5px">${M.icon(ic)} ${esc(ev.title)}</div>
          <div class="item-s muted small">${esc(M.dt(ev.at))}${ev.user?' · '+esc(ev.user):''}</div>
          ${ev.detail?`<div class="muted small" style="margin-top:2px">${esc(ev.detail)}</div>`:''}
        </div></div>`;
    }).join('')}</div>`;
  }
}
$('cvVisit').onclick = () => { M.close('cv'); openForm({ clientId: cvId }); };
$('btnNextCall').innerHTML = M.icon('next') + ' اتصل بالعميل التالي';
$('btnNextCall').onclick = e => M.busy(e.currentTarget, async () => {
  const j = await M.get('next_customer');
  if (!j.success) { M.toast(j.message || 'مفيش عملاء تانيين', { type: j.message ? '' : 'bad' }); return; }
  openClient(j.data.id);
});

/* =====================================================================
   نموذج الزيارة / العميل
   ===================================================================== */
// [اسم الحقل في الطلب, العمود في قاعدة البيانات, العنوان, النوع, يملأ السطر كله]
const F_MAIN = [
  ['client_name', 'name', 'اسم العميل *', 'text', 1],
  ['client_phone', 'phone', 'رقم التليفون', 'tel'], ['client_nid', 'nid', 'الرقم القومي', 'text'],
  ['client_address', 'address', 'العنوان', 'text', 1], ['client_landmark', 'landmark', 'علامة مميزة', 'text', 1],
  ['client_loan', 'loan_balance', 'رصيد القرض', 'number'], ['client_fine', 'interest_fine_balance', 'إجمالي المديونية (شامل رصيد القرض)', 'number'],
  ['client_installment', 'installment', 'القسط', 'number'], ['client_delay', 'delay_days', 'أيام التأخير', 'number'],
  ['client_case', 'legal_num', 'رقم القضية', 'text'], ['client_verdict', 'legal_status', 'حالة الحكم', 'text']
];
const F_MORE = [
  ['client_guarantor_name', 'guarantor_name', 'اسم الضامن', 'text'], ['client_guarantor_phone', 'guarantor_phone', 'تليفون الضامن', 'tel'],
  ['client_guarantor_relation', 'guarantor_relation', 'صلة القرابة', 'text'], ['client_guarantor_card', 'guarantor_card', 'بطاقة الضامن', 'text'],
  ['client_guarantor_address', 'guarantor_address', 'عنوان الضامن', 'text', 1],
  ['client_activity_address', 'activity_address', 'عنوان النشاط', 'text', 1], ['client_activity_landmark', 'activity_landmark', 'علامة النشاط', 'text', 1],
  ['client_loan_number', 'loan_number', 'رقم القرض', 'text'], ['client_client_number', 'client_number', 'رقم العميل', 'text'],
  ['client_branch', 'branch', 'الفرع', 'text'], ['client_governorate', 'governorate', 'المحافظة', 'text']
];
const fieldHtml = f => `<label class="field" ${f[4] ? 'style="grid-column:1/-1"' : ''}><span>${f[2]}</span><input class="input" id="f_${f[0]}" type="${f[3] === 'number' ? 'number' : 'text'}" ${f[3] === 'number' ? 'step="any" inputmode="decimal"' : ''} ${f[3] === 'tel' ? 'inputmode="tel"' : ''} ${f[3] !== 'text' ? 'dir="ltr" style="text-align:right"' : ''}></label>`;
$('fMain').innerHTML = F_MAIN.map(fieldHtml).join('');
$('fMore').innerHTML = F_MORE.map(fieldHtml).join('');
$('fStatus').innerHTML = Object.entries(M.VISIT).map(([k, v]) => `<option value="${k}">${v.t}</option>`).join('');
$('fStatus').onchange = paintAmt;
function paintAmt() { $('fAmtBox').classList.toggle('hide', !['paid', 'partial'].includes($('fStatus').value)); }
M.bindPick($('pkF')); M.bindPick($('pkB'));

let collectors = [];
async function loadCollectors() {
  if (collectors.length) return;
  const j = await M.get('get_team_collectors');
  collectors = j.success ? j.collectors : [];
  const groups = {};
  collectors.forEach(c => (groups[c.admin_name || ''] = groups[c.admin_name || ''] || []).push(c));
  const keys = Object.keys(groups);
  $('fCollector').innerHTML = '<option value="">— اختر المحصل —</option>' + keys.map(k => {
    const opts = groups[k].map(c => `<option value="${c.id}">${esc(c.full_name)}</option>`).join('');
    return keys.length > 1 && k ? `<optgroup label="فريق ${esc(k)}">${opts}</optgroup>` : opts;
  }).join('');
}

let form = { clientId: 0, visitId: 0, isNew: false };
async function openForm({ clientId = 0, visitId = 0 }) {
  await loadCollectors();
  form = { clientId, visitId, isNew: !clientId && !visitId };
  const all = [...F_MAIN, ...F_MORE];
  all.forEach(f => $('f_' + f[0]).value = '');
  $('fDir').value = ''; $('fAmt').value = ''; $('fStatus').value = 'pending'; $('fDate').value = M.today();
  $('fCollector').value = localStorage.getItem('lastCollector') || '';
  $('fCollNotes').classList.add('hide');
  $('pkF')._reset(null, 'وجه البطاقة'); $('pkB')._reset(null, 'ظهر البطاقة');
  $('vfTitle').textContent = form.isNew ? 'عميل جديد + زيارة' : visitId ? 'تعديل الزيارة' : 'إضافة زيارة';
  $('vfSave').textContent = 'حفظ';
  M.open('vf');

  let client = null;
  if (visitId) {
    const j = await M.get('get_visit', { id: visitId });
    if (!j.success) { M.close('vf'); return M.err(j.message); }
    const v = j.visit; client = j.client; form.clientId = client.id;
    $('fCollector').value = v.collector_id; $('fDate').value = v.visit_date; $('fStatus').value = v.status || 'pending';
    $('fAmt').value = +v.collected_amount || ''; $('fDir').value = v.admin_notes || '';
    if (v.collector_notes) { $('fCollNotes').innerHTML = `<small>ملاحظات المحصل</small>${esc(v.collector_notes)}`; $('fCollNotes').classList.remove('hide'); }
  } else if (clientId) {
    const j = await M.get('get_client_by_id', { id: clientId });
    if (!j.success) { M.close('vf'); return M.err(j.message); }
    client = j.client;
  }
  if (client) {
    all.forEach(f => { const v = client[f[1]]; $('f_' + f[0]).value = v == null ? '' : v; });
    $('pkF')._reset(client.id_front_image, 'وجه البطاقة'); $('pkB')._reset(client.id_back_image, 'ظهر البطاقة');
  }
  paintAmt();
}

$('vfSave').onclick = e => M.busy(e.currentTarget, async () => {
  const collector = $('fCollector').value;
  if (!collector) return M.err('اختار المحصل');
  if (!$('f_client_name').value.trim()) return M.err('اسم العميل مطلوب');
  const fd = new FormData();
  if (form.isNew) fd.append('is_new_client', '1'); else fd.append('client_id', form.clientId);
  if (form.visitId) fd.append('visit_id', form.visitId);
  fd.append('collector_id', collector);
  fd.append('visit_date', $('fDate').value || M.today());
  fd.append('status', $('fStatus').value);
  fd.append('collected_amount', ['paid', 'partial'].includes($('fStatus').value) ? ($('fAmt').value || 0) : 0);
  fd.append('admin_notes', $('fDir').value.trim());
  [...F_MAIN, ...F_MORE].forEach(f => fd.append(f[0], $('f_' + f[0]).value.trim()));
  for (const [pk, name] of [['pkF', 'id_front_image'], ['pkB', 'id_back_image']]) {
    const f = $(pk).querySelector('input').files[0];
    if (f) fd.append(name, await M.compress(f), name + '.jpg');
  }
  const j = await M.api('?action=save_visit', { method: 'POST', body: fd });
  if (!j.success) return M.err(j.message);
  localStorage.setItem('lastCollector', collector);
  M.close('vf');
  M.toast(j.message || 'تم الحفظ');
  if (j.warnings && j.warnings.length) setTimeout(() => M.toast('تنبيه: ' + j.warnings.join(' — '), { type: 'bad', ms: 6000 }), 1800);
  loadClients(); loadVisits(true);
});

/* =====================================================================
   الزيارات المُدخلة
   ===================================================================== */
const V = { filter: 'today', list: [], today: M.today() };
async function loadVisits(silent) {
  if (!silent) $('vList').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  const j = await M.get('get_my_visits', { filter: V.filter });
  if (!j.success) { $('vList').innerHTML = `<div class="empty">${esc(j.message || 'تعذر التحميل')}</div>`; return; }
  V.list = j.visits; V.today = j.today;
  $('kTotal').textContent = M.num(j.stats.today_total); $('kDone').textContent = M.num(j.stats.today_done); $('kPend').textContent = M.num(j.stats.today_pending);
  $('chOver').textContent = j.stats.overdue ? `متأخرة (${j.stats.overdue})` : 'متأخرة';
  if (!V.list.length) { $('vList').innerHTML = `<div class="empty">${M.icon('calendar')}مفيش زيارات هنا</div>`; return; }
  $('vList').innerHTML = `<div class="list">${V.list.map((v, i) => `<div class="item ${M.visitEdge(v.status)}" data-i="${i}">
    <div class="grow"><div class="item-t">${esc(v.name)}</div>
      <div class="item-s">المحصل: <b>${esc(v.collector_name || '—')}</b> · ${M.dmy(v.visit_date)}${v.visited_at ? ' · تمت ' + M.hm(v.visited_at) : ''}</div>
      <div class="item-x"><b class="num" style="color:var(--brass)">${M.money(v.total_debt)} ج.م</b>${M.visitTag(v.status)}${+v.collected_amount ? `<span class="tag ok">تحصيل ${M.money(v.collected_amount)}</span>` : ''}</div></div></div>`).join('')}</div>`;
}
$('vChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  M.$$('#vChips .chip').forEach(x => x.classList.toggle('on', x === b));
  V.filter = b.dataset.f; loadVisits();
});
let curV = null;
$('vList').addEventListener('click', e => {
  const it = e.target.closest('.item'); if (!it) return;
  const v = curV = V.list[+it.dataset.i];
  $('vdTitle').textContent = v.name; $('vdTag').innerHTML = M.visitTag(v.status);
  $('vdBody').innerHTML =
    `<div class="kv" style="margin-bottom:6px"><dt>المحصل</dt><dd>${esc(v.collector_name || '—')}</dd><dt>تاريخ الزيارة</dt><dd>${M.dmy(v.visit_date)}</dd><dt>وقت التنفيذ</dt><dd>${v.visited_at ? M.dt(v.visited_at) : 'لسه'}</dd>${+v.collected_amount ? `<dt>المحصّل</dt><dd>${M.money(v.collected_amount)} ج.م</dd>` : ''}</div>` +
    (v.admin_notes ? `<div class="note dir"><small>توجيهاتك للمحصل</small>${esc(v.admin_notes)}</div>` : '') +
    (v.collector_notes ? `<div class="note"><small>ملاحظات المحصل</small>${esc(v.collector_notes)}</div>` : '') +
    (v.phone ? `<div class="row nowrap" style="margin-top:12px">${M.callBtn(v.phone, { cls: 'grow', showNum: true, name: v.name })}</div>` : '') +
    `<div style="height:10px"></div>` + M.customerBody(v);
  M.open('vd');
});
$('vdEdit').onclick = () => { M.close('vd'); openForm({ visitId: curV.id }); };
$('vdDel').onclick = async () => {
  if (!await M.confirm(`هتحذف زيارة "${curV.name}" بتاريخ ${M.dmy(curV.visit_date)}؟ الحذف نهائي.`, { title: 'حذف زيارة', danger: true, ok: 'حذف' })) return;
  const j = await M.post('delete_visit', { visit_id: curV.id });
  if (!j.success) return M.err(j.message);
  M.close('vd'); M.toast('تم حذف الزيارة'); loadVisits(true); loadClients();
};
setInterval(() => { if (!document.hidden && M.$('#pane-visits.on') && !M.$('.overlay.on')) loadVisits(true); }, 30000);

/* ---------- دورة التحصيل المسندة ---------- */
const collectionCyclePanel = M.collectionCyclePanel($('collectionCycleBox'));

/* ---------- تشغيل ---------- */
loadClients();
M.tabs($('tabs'), name => { if (name === 'visits') loadVisits(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) collectionCyclePanel?.reload();
});
setInterval(() => { if (!document.hidden) collectionCyclePanel?.reload(); }, 60000);
(async () => {
  const ev = new URLSearchParams(location.search).get('edit_visit');
  if (ev) { history.replaceState(null, '', location.pathname); openForm({ visitId: +ev }); }
})();
</script>
</body>
</html>
